<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitchell Inventory &amp; Pallet Tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>

<style>
:root{
  --navy:#1E2235; --navy2:#2A2F49; --taupe:#9E9589; --taupe-l:#D9D3C9; --gold:#AD8B5C;
  --bg:#F5F4F1; --ink:#1E2235; --muted:#7B786F; --border:#E3E0D8;
  --success:#3E7A5E; --success-bg:#E4EFE8; --warn:#8A6A2F; --warn-bg:#F2E9D8;
  --danger:#A8382F; --danger-bg:#F5E4E2; --info:#3E4A8A; --info-bg:#E5E7F2;
  --radius:10px; --font-ui:'Inter',sans-serif; --font-display:'Anton',sans-serif;
}
*{box-sizing:border-box}
p{margin:0}
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px}
h1,h2,h3{font-weight:600;margin:0}
.app{display:block;min-height:100vh}
.topheader{background:#fff;border-bottom:1px solid var(--border);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.topheader-left{display:flex;align-items:center;gap:14px;min-width:0}
.topheader-logo{height:38px;max-width:230px;object-fit:contain;flex-shrink:0}
.topheader-logo-placeholder{height:38px;padding:0 16px;border:1.5px dashed var(--border);border-radius:8px;display:flex;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.topheader-titles{display:flex;flex-direction:column;min-width:0}
.topheader-company{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topheader-sub{font-size:12px;color:var(--muted)}
.topheader-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topnav-btn{padding:9px 15px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.topnav-btn:hover{border-color:var(--muted)}
.topnav-btn.active{background:var(--bg);border-color:var(--ink);font-weight:500}
.mainwrap{max-width:1320px;margin:0 auto;padding:0}
.main{padding:30px 28px 40px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px}
.crumb{font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:4px}
.crumb:hover{color:var(--ink);text-decoration:underline}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.btn{border:1px solid var(--gold);background:var(--gold);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.secondary{background:#fff;color:var(--navy)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--ink)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 11px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.job-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.job-card{cursor:pointer}
.job-card:hover{border-color:var(--taupe)}
.job-card h3{font-size:15px;margin-bottom:4px}
.job-card .addr{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.stats{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.badge.active{background:var(--success-bg);color:var(--success)}
.badge.closed{background:#EFECE8;color:var(--muted)}
.badge.rough{background:var(--warn-bg);color:var(--warn)}
.badge.trim{background:var(--info-bg);color:var(--info)}
.badge.missing{background:var(--danger-bg);color:var(--danger)}
.badge.loc{background:#EFECE8;color:var(--ink)}
.badge.cat{background:#EDE7F6;color:#5B4B8A}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:9px 4px;margin-right:18px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:#FAFAF8}
.card.rowlink{cursor:pointer}
.card.rowlink:hover{border-color:var(--taupe)}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(30,34,53,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:26px}
.modal.wide{max-width:760px}
.modal-close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
label.f{display:block;font-size:11px;color:var(--muted);margin:14px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-family:var(--font-ui);font-size:13.5px}
input[type="checkbox"],input[type="radio"]{width:16px;height:16px;flex:none;margin:0}
textarea{resize:vertical;min-height:56px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.checklist{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.checklist label{display:flex;align-items:center;gap:10px;font-size:13px;padding:10px 12px;text-transform:none;font-weight:400;color:var(--ink);margin:0;border-bottom:1px solid var(--border);cursor:pointer}
.checklist label:last-child{border-bottom:none}
.checklist label:hover{background:#FAFAF8}
.checklist label .cl-code{color:var(--muted);font-size:12px;min-width:56px}
.checklist label .cl-name{flex:1}
.checklist .none{color:var(--muted);font-size:12.5px;padding:14px 12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.history{font-size:12px;color:var(--muted);margin-top:6px}
.history div{padding:4px 0;border-bottom:1px dashed var(--border)}
/* label templates */
.label{border:2.5px solid var(--ink);border-radius:16px;padding:10px;background:#fff;width:100%;max-width:560px;margin:0 auto}
.lk{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.ltitle{font-family:var(--font-display);font-size:29px;line-height:1.05;margin:3px 0 6px;text-transform:uppercase;letter-spacing:.01em}
.lhr{border:none;border-top:1.5px solid var(--ink);margin:4px 0}
.lvariant{font-size:16px;font-weight:600;color:var(--muted);margin-top:2px}
.ltop{display:grid;grid-template-columns:1fr 118px;gap:12px}
.lmid2{display:grid;grid-template-columns:1fr 118px;gap:10px;margin-top:10px}
.lgrid{display:grid;grid-template-columns:1fr 156px;gap:10px}
.lleft{display:flex;flex-direction:column;height:100%}
.lphotorow{display:grid;grid-template-columns:96px 1fr;gap:10px;margin-top:8px;flex:1}
.lright{display:flex;flex-direction:column;align-items:center}
.lright .qrwrap{width:100%}
.lhr2{width:100%;border:none;border-top:1px solid var(--border);margin:4px 0}
.lplanwrap{display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;gap:5px}
.lphoto{border:1px solid var(--border);border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;background:#FAFAF8}
.lphoto img{width:100%;height:100%;object-fit:cover}
.ldbox{border:1px solid var(--border);border-radius:7px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:#FAFAF8}
.ldcell{padding:8px 10px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center}
.ldcell:last-child{border-right:none}
.lfield{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.lval{font-size:19px;font-weight:700;margin-top:4px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.lcircle{width:90px;height:90px;border-radius:50%;border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAF8}
.lcirclbl{font-size:8px;color:var(--muted)}
.lcircval{font-size:24px;font-family:'Oswald',sans-serif;font-weight:700;line-height:1;letter-spacing:.01em}
.lbottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:7px;padding-top:7px}
.lcatwrap{display:flex;align-items:center;gap:7px}
.lcaticon{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.llogowrap{display:flex;align-items:center;gap:7px}
.llogobox{width:160px;height:54px;border:1.5px dashed var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--muted);overflow:hidden;flex-shrink:0}
.llogobox img{width:100%;height:100%;object-fit:contain}
.lfooterinfo{font-size:8.5px;color:var(--muted);text-align:center;margin-top:7px;letter-spacing:.02em}
.lconame{font-size:11px;font-weight:600}
.qrwrap{width:100%;aspect-ratio:1;border:2px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px;background:#fff;cursor:pointer}
.qrwrap img,.qrwrap canvas{width:100% !important;height:100% !important}
.qrpair{display:flex;gap:6px}
.qrpair .qrwrap{width:50%}
.qrlbl{text-align:center;font-size:8px;color:var(--muted);margin-top:2px}
.qrblock-bottom{display:flex;flex-direction:column;align-items:center;gap:3px}
.qrpair-lg{display:flex;gap:10px}
.qrwrap-lg{width:98px;height:98px;border:2px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;background:#fff}
.qrwrap-lg.empty{font-size:8px;color:var(--muted);text-align:center}
.qrlbl-lg{text-align:center;font-size:9px;color:var(--muted);width:98px}
.qrlblrow-lg{display:flex;gap:10px}
.label-actions{display:flex;gap:8px;justify-content:center;margin-top:16px}
/* engineering-spec item label */
.selbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.selbar .n{font-weight:600}
.selbar .spacer{flex:1}
.selbar button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;padding:6px 12px;border-radius:6px;font-size:12.5px;cursor:pointer}
.selbar button:hover{background:rgba(255,255,255,.12)}
.rowthumb{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);object-fit:cover;background:var(--bg)}
.stat-tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.stat-tile .num{font-size:32px;font-weight:600;line-height:1}
.stat-tile .num.warn{color:var(--danger)}
.stat-tile .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat-grid-4{grid-template-columns:repeat(4,1fr)}
.attention-panel{background:#FBF6EC;border:1px solid #EDE0C2;border-radius:12px;padding:16px 18px;margin-bottom:22px}
.attention-panel .ap-head{font-weight:600;font-size:14px;margin-bottom:2px}
.attention-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #EDE0C2;cursor:pointer}
.attention-row:hover .an{text-decoration:underline}
.tasks-panel{background:#FBF6EC;border:1px solid #EDE0C2;border-radius:12px;padding:16px 18px;margin-bottom:20px}
.tasks-panel .tp-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.tasks-panel .tp-title{font-weight:600;font-size:16px}
.tasks-panel .tp-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tasks-panel .tp-sub strong{color:var(--danger)}
.tp-filter{display:flex;gap:4px;background:#fff;border:1px solid #EDE0C2;border-radius:8px;padding:2px}
.tp-filter button{border:none;background:transparent;padding:5px 10px;font-size:12px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tp-filter button.active{background:var(--navy);color:#fff}
.task-row{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid #EDE0C2;border-radius:9px;padding:11px 13px;margin-top:8px}
.task-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:5px;flex-shrink:0}
.task-dot.overdue{background:var(--danger)}
.task-main{flex:1;min-width:0}
.task-title{font-weight:600;font-size:13.5px}
.task-sub{font-size:12px;color:var(--muted);margin-top:1px}
.task-note{margin-top:6px;padding-left:10px;border-left:2px solid #EDE0C2;font-size:12px;color:var(--ink)}
.task-note .tn-lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-right:5px}
.task-right{text-align:right;flex-shrink:0}
.task-date{font-size:11px;color:var(--muted);margin-top:4px}
.task-date.overdue{color:var(--danger);font-weight:600}
.rowthumb.empty{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)}
.split-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--info);margin-top:3px;cursor:pointer;font-weight:500}
.split-tag:hover{text-decoration:underline}
.ccard-check{position:absolute;top:14px;left:14px}
.loc-group-header{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px solid var(--navy);margin-bottom:2px}
.loc-group-header .lgname{font-weight:600;font-size:14px}
.loc-group-header .lgcount{background:var(--taupe-l);color:var(--navy);font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.loc-group-header.exception{border-bottom-color:var(--danger)}
.lg-collapse{cursor:pointer;color:var(--muted);font-size:12px;user-select:none;width:16px;text-align:center;flex-shrink:0}
.lg-collapse:hover{color:var(--ink)}

@media print{
  .app,#modalRoot{display:none !important}
  #printArea{display:block !important;position:static;width:100%;padding:0}
  #printArea .label{width:100% !important;height:100% !important;max-width:none;margin:0;box-sizing:border-box;page-break-inside:avoid}
  #printArea .label-page{page-break-after:always;width:100%;height:100%}
  #printArea .label-page:last-child{page-break-after:auto}
}
</style>
</head>

/* ---------------- data layer ---------------- */

const LOCATIONS=[

let DB=null;
function hydrate(d){
  if(d.settings && !d.settings.categories) d.settings.categories=[...DEFAULT_CATEGORIES];

async function loadFromSupabase(){
  try{
    const {data,error}=await sb.from('inventory_state').select('data').eq('id',STATE_ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data){
      localStorage.setItem(DB_KEY,JSON.stringify(data.data));
      return hydrate(data.data);
    }
    const s=seed();
    const {error:insErr}=await sb.from('inventory_state').upsert({id:STATE_ROW_ID,data:s});
    if(insErr) throw insErr;
    localStorage.setItem(DB_KEY,JSON.stringify(s));
    return s;
  }catch(e){
    console.error('Supabase load failed, falling back to local cache',e);
    document.getElementById('syncBanner').style.display='block';
    const raw=localStorage.getItem(DB_KEY);
    if(raw){ try{return hydrate(JSON.parse(raw));}catch(e2){} }
    return seed();
  }
}
let saveTimer=null;
function save(){
  localStorage.setItem(DB_KEY,JSON.stringify(DB));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushToSupabase,150);

async function pushToSupabase(){
  try{

  }catch(e){

}

function subscribeRealtime(){
  sb.channel('inventory_state_changes')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'inventory_state',filter:'id=eq.'+STATE_ROW_ID},payload=>{
      if(!payload.new || !payload.new.data) return;

/* ---------------- cascade logic ---------------- */
function cascadeContainer(containerId,newLoc,trigger,changedBy){
  const c=getContainer(containerId);
  if(!c) return;
  const prev=c.location;
  if(trigger==='manual' && c.type==='tote' && c.parentId){
    const parent=getContainer(c.parentId);
    c.parentId=null;
    addLog('container',c.id,c.code,prev,newLoc,'manual (detached from '+(parent?parent.code:'pallet')+')',changedBy);
  } else {
    addLog('container',c.id,c.code,prev,newLoc,trigger,changedBy);
  }
  c.location=newLoc;

  // direct items on this container
  itemsInJob(c.jobId).filter(i=>i.containerId===c.id).forEach(it=>{
    if(shouldSkip(it.location,newLoc)) return;
    const p=it.location;
    it.location=newLoc;
    addLog('item',it.id,it.code,p,newLoc,'cascade from '+c.code,changedBy);
  });

  // nested containers (totes on a pallet)
  DB.containers.filter(x=>x.parentId===c.id).forEach(child=>{
    if(shouldSkip(child.location,newLoc)) return;
    cascadeContainer(child.id,newLoc,'cascade from '+c.code,changedBy);
  });
}
function shouldSkip(currentLoc,newLoc){
  if(currentLoc==='installed') return true; // already past every stage
  if(isException(currentLoc)) return true; // missing/returned frozen until manually cleared
  if(!isException(newLoc)){
    const cr=rankOf(currentLoc), nr=rankOf(newLoc);
    if(cr!==null && nr!==null && cr>nr) return true; // already further along
  }
  return false;
}
function setItemLocationDirect(itemId,newLoc,changedBy){
  const it=getItem(itemId); if(!it) return;
  const prev=it.location; it.location=newLoc;
  if(newLoc==='installed' && it.containerId){
    const c=getContainer(it.containerId);
    it.containerId=null;
    addLog('item',it.id,it.code,prev,newLoc,'manual (auto-removed from '+(c?c.code:'container')+' on install)',changedBy);
  } else {
    addLog('item',it.id,it.code,prev,newLoc,'manual',changedBy);
  }
}
function removeItemFromContainer(itemId){
  const it=getItem(itemId); if(!it||!it.containerId) return;
  const c=getContainer(it.containerId);
  it.containerId=null;
  addLog('item',it.id,it.code,it.location,it.location,'removed from '+(c?c.code:'container'),currentUserName());
  closeModal(); render(); openItemModal(it.id);
}

function openEditContainerModal(containerId){
  const c=getContainer(containerId); if(!c) return;
  const currentItems=itemsInJob(c.jobId).filter(i=>i.containerId===c.id);
  const availableItems=itemsInJob(c.jobId).filter(i=>!i.containerId);
  const itemPool=[...currentItems,...availableItems];
  const currentTotes=c.type==='pallet'?DB.containers.filter(x=>x.parentId===c.id):[];
  const availableTotes=c.type==='pallet'?containersInJob(c.jobId,'tote').filter(t=>!t.parentId && t.id!==c.id):[];
  const totePool=[...currentTotes,...availableTotes];
  openModal(`<span class="modal-close" onclick="closeModal()">&times;</span>
    <h2>Edit ${c.code}</h2>
    <div class="sub">Add or remove contents. Removed items/totes become unassigned, not deleted.</div>
    <label class="f">Category</label>
    <select id="ecCategory">${cats().map(cat=>`<option value="${cat}" ${cat===c.category?'selected':''}>${cat}</option>`).join('')}</select>
    <label class="f" style="margin-top:14px">Items</label>
    <div class="checklist">
      ${itemPool.length? itemPool.map(i=>`<label><input type="checkbox" value="${i.id}" class="ecItemChk" ${i.containerId===c.id?'checked':''}><span class="cl-code">${i.code}</span><span class="cl-name">${escapeHtml(i.productName)}</span>${catBadge(i.category)}</label>`).join('') : '<div class="none">No items available.</div>'}
    </div>
    ${c.type==='pallet'?`<label class="f">Totes</label>
    <div class="checklist">
      ${totePool.length? totePool.map(t=>`<label><input type="checkbox" value="${t.id}" class="ecToteChk" ${t.parentId===c.id?'checked':''}><span class="cl-code">${t.code}</span><span class="cl-name">${itemsInJob(c.jobId).filter(i=>i.containerId===t.id).length} items</span></label>`).join('') : '<div class="none">No totes available.</div>'}
    </div>`:''}
    <div class="row" style="margin-top:20px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitEditContainer('${c.id}')">Save changes</button>
    </div>`,'wide');
}
function submitEditContainer(containerId){
  const c=getContainer(containerId); if(!c) return;
  c.category=document.getElementById('ecCategory').value;
  const checkedItemIds=new Set([...document.querySelectorAll('.ecItemChk:checked')].map(el=>el.value));
  itemsInJob(c.jobId).forEach(it=>{
    const shouldBeIn=checkedItemIds.has(it.id);
    const isIn=it.containerId===c.id;
    if(shouldBeIn && !isIn){it.containerId=c.id; it.location=c.location;}
    else if(!shouldBeIn && isIn){it.containerId=null;}
  });
  if(c.type==='pallet'){
    const checkedToteIds=new Set([...document.querySelectorAll('.ecToteChk:checked')].map(el=>el.value));
    containersInJob(c.jobId,'tote').forEach(t=>{
      const shouldBeIn=checkedToteIds.has(t.id);
      const isIn=t.parentId===c.id;
      if(shouldBeIn && !isIn){t.parentId=c.id; t.location=c.location;}
      else if(!shouldBeIn && isIn){t.parentId=null;}
    });
  }
  addLog('container',c.id,c.code,null,c.location,'contents edited',currentUserName());
  closeModal(); render(); openContainerDetailModal(c.id);
}
let BULK_IMPORT={headers:[],rows:[],images:[]};
const IMPORT_FIELDS=[
  {key:'productName',label:'Product name',required:true},
  {key:'variant',label:'Variant / description'},
  {key:'vendor',label:'Vendor'},
  {key:'category',label:'Category'},
  {key:'phase',label:'Phase (rough-in/trim-out)'},
  {key:'qty',label:'Quantity'},
  {key:'roomLocation',label:'Location'},
  {key:'planMarker',label:'Plan marker'},
  {key:'photoUrl',label:'Photo URL'}
];
function openBulkImportModal(jobId){
  openModal(`<span class="modal-close" onclick="closeModal()">&times;</span>
    <h2>Bulk import items</h2>
    <div class="sub">Upload an XLSX or CSV file, then map its columns to item fields.</div>
    <label class="f">File</label>
    <input id="bulkFile" type="file" accept=".xlsx,.xls,.csv" onchange="handleBulkFile(event,'${jobId}')">
    <div id="bulkErr" style="display:none;color:var(--danger);font-size:12px;margin-top:6px"></div>
    <label class="f" style="margin-top:14px">Plan location link <span class="sub">(applied to every item in this import)</span></label>
    <input id="bulkPlanUrl" placeholder="https://plans.mitchellconstruction.com/morris?category=plumbing">
    <div class="hint">Since you're importing a whole category at once, this one link gets applied to every item in the batch rather than mapping it per row.</div>
    <div id="bulkMapHost"></div>`,'wide');

function handleBulkFile(evt,jobId){
  const file=evt.target.files[0];
  const errEl=document.getElementById('bulkErr');
  if(!file) return;
  if(!window.XLSX){errEl.textContent='File parser failed to load (needs internet access). Try again once you have a connection.';errEl.style.display='block';return;}
  const isXlsx=/\.xlsx$/i.test(file.name);
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const buf=e.target.result;
      const wb=XLSX.read(buf,{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
      if(!rows.length){errEl.textContent='That file has no rows.';errEl.style.display='block';return;}
      BULK_IMPORT.headers=rows[0].map(h=>String(h||'').trim());
      BULK_IMPORT.rows=rows.slice(1).filter(r=>r.some(cell=>String(cell||'').trim()));
      BULK_IMPORT.images=[];
      errEl.style.display='none';
      if(isXlsx && window.JSZip){
        JSZip.loadAsync(buf).then(zip=>{
          const mediaFiles=Object.keys(zip.files).filter(n=>/^xl\/media\//i.test(n));
          mediaFiles.sort((a,b)=>{
            const na=parseInt((a.match(/(\d+)/)||['0'])[0]);
            const nb=parseInt((b.match(/(\d+)/)||['0'])[0]);
            return na-nb;
          });
          Promise.all(mediaFiles.map(name=>{
            const ext=(name.split('.').pop()||'png').toLowerCase();
            const mime=ext==='jpg'||ext==='jpeg'?'image/jpeg':ext==='gif'?'image/gif':ext==='bmp'?'image/bmp':'image/png';
            return zip.files[name].async('base64').then(b64=>'data:'+mime+';base64,'+b64);
          })).then(images=>{
            BULK_IMPORT.images=images;
            renderBulkMapUI(jobId);
          });
        }).catch(()=>{ renderBulkMapUI(jobId); });
      } else {
        renderBulkMapUI(jobId);
      }
    }catch(err){
      errEl.textContent='Could not read that file: '+err.message;
      errEl.style.display='block';
    }
  };
  reader.readAsArrayBuffer(file);
}
function guessColumn(fieldKey,fieldLabel,headers){
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const target=norm(fieldLabel.split('(')[0]);
  let idx=headers.findIndex(h=>norm(h)===target);
  if(idx===-1){
    const aliases={productName:['product','item','name'],variant:['description','finish','notes'],vendor:['supplier'],category:['type','trade'],phase:['stage'],qty:['quantity','count'],roomLocation:['location','room'],planMarker:['marker','plan'],photoUrl:['photo','image','picture']};
    const alist=aliases[fieldKey]||[];
    idx=headers.findIndex(h=>alist.some(a=>norm(h).includes(a)));
  }
  return idx;
}
function renderBulkMapUI(jobId){
  const headers=BULK_IMPORT.headers;
  const host=document.getElementById('bulkMapHost');
  const imgCount=BULK_IMPORT.images.length;
  const countMatches=imgCount===BULK_IMPORT.rows.length;
  host.innerHTML=`
    <label class="f" style="margin-top:16px">Map columns</label>
    ${IMPORT_FIELDS.map(f=>{
      const guess=guessColumn(f.key,f.label,headers);
      return `<div class="row" style="margin-bottom:6px">
        <div style="width:180px;font-size:13px">${f.label}${f.required?' <span style="color:var(--danger)">*</span>':''}</div>
        <select id="map_${f.key}" style="flex:1" ${f.key==='photoUrl'&&imgCount?'disabled':''}>
          <option value="-1">&mdash; Skip &mdash;</option>
          ${headers.map((h,i)=>`<option value="${i}" ${i===guess?'selected':''}>${escapeHtml(h||'(column '+(i+1)+')')}</option>`).join('')}
        </select>
        ${guess===-1&&(f.key==='roomLocation'||f.key==='planMarker')?'<span class="sub" style="color:var(--warn);width:150px">No column matched \u2014 check this</span>':''}
      </div>`;
    }).join('')}
    ${imgCount?`<div class="hint" style="margin-top:4px">
      Found ${imgCount} embedded photo${imgCount===1?'':'s'} in this file.
      ${countMatches?' That matches your row count, so photos will be matched to rows top-to-bottom in the order they appear in the file.':' That doesn\'t match your row count ('+BULK_IMPORT.rows.length+' rows) \u2014 order-based matching would likely misassign some photos. Double-check placement after import, or use a Photo URL column instead.'}
      <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:400;text-transform:none;cursor:pointer">
        <input type="checkbox" id="useEmbeddedPhotos" ${countMatches?'checked':''}> Use these embedded photos, matched to rows in order
      </label>
    </div>`:`<div class="sub" style="margin-top:8px">No embedded photos found in this file. Photo URL pulls an image from a link in a column instead.</div>`}
    <label class="f" style="margin-top:14px">Preview (first 3 rows)</label>
    <div style="overflow:auto;border:1px solid var(--border);border-radius:8px">
      <table style="font-size:12px"><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
      <tbody>${BULK_IMPORT.rows.slice(0,3).map(r=>`<tr>${headers.map((h,i)=>`<td>${escapeHtml(String(r[i]||''))}</td>`).join('')}</tr>`).join('')}</tbody></table>
    </div>
    <div id="bulkImportErr" style="display:none;color:var(--danger);font-size:12px;margin-top:8px"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitBulkImport('${jobId}')">Import ${BULK_IMPORT.rows.length} item${BULK_IMPORT.rows.length===1?'':'s'}</button>
    </div>`;
}
function submitBulkImport(jobId){
  const mapping={};
  IMPORT_FIELDS.forEach(f=>{ mapping[f.key]=parseInt(document.getElementById('map_'+f.key).value); });
  if(mapping.productName<0){
    const errEl=document.getElementById('bulkImportErr');
    errEl.textContent='Product name must be mapped to a column \u2014 it\'s the one field every item needs.';
    errEl.style.display='block';
    return;
  }
  const validCats=cats();
  const useEmbedded=document.getElementById('useEmbeddedPhotos')&&document.getElementById('useEmbeddedPhotos').checked;
  const sharedPlanUrl=document.getElementById('bulkPlanUrl').value.trim();
  let count=0;
  const emptyFieldCounts={roomLocation:0,planMarker:0,vendor:0,category:0};
  BULK_IMPORT.rows.forEach((r,idx)=>{
    const get=key=>mapping[key]>=0?String(r[mapping[key]]||'').trim():'';
    const productName=get('productName');
    if(!productName) return;
    const rawCat=get('category');
    const category=validCats.find(c=>c.toLowerCase()===rawCat.toLowerCase())||validCats[validCats.length-1];
    const rawPhase=get('phase').toLowerCase();
    const phase=rawPhase.includes('rough')?'rough-in':'trim-out';
    const qtyRaw=parseInt(get('qty'))||1;
    const photo=useEmbedded?(BULK_IMPORT.images[idx]||''):get('photoUrl');
    const roomLocation=get('roomLocation');
    const planMarker=get('planMarker');
    if(!roomLocation) emptyFieldCounts.roomLocation++;
    if(!planMarker) emptyFieldCounts.planMarker++;
    if(!get('vendor')) emptyFieldCounts.vendor++;
    const it={
      id:uid('i'), code:nextCode('item'), jobId,
      productName, variant:get('variant'), vendor:get('vendor'), category, phase,
      trackAs:qtyRaw>1?'package':'individual', qty:qtyRaw,
      roomLocation, planMarker, planUrl:sharedPlanUrl,
      photo, containerId:null, location:'office', createdAt:Date.now()
    };
    DB.items.push(it);
    addLog('item',it.id,it.code,null,'office','created (bulk import)',currentUserName());
    count++;
  });
  closeModal(); render();
  let msg=count+' item'+(count===1?'':'s')+' imported.';
  if(count>0){
    const warnings=[];
    if(mapping.roomLocation>=0 && emptyFieldCounts.roomLocation===count) warnings.push('Location came out blank for every row \u2014 the mapped column had no usable values, or the wrong column is selected.');
    if(mapping.planMarker>=0 && emptyFieldCounts.planMarker===count) warnings.push('Plan marker came out blank for every row \u2014 same likely cause.');
    if(mapping.roomLocation<0) warnings.push('Location wasn\'t mapped to a column at all, so it\'s blank on every imported item.');
    if(warnings.length) msg+='\n\nHeads up:\n'+warnings.join('\n');
  }
  alert(msg);
}

function submitNewItem(jobId,presetCode,fromGenericId){
  const name=document.getElementById('itName').value.trim();
  const errEl=document.getElementById('itErr');
  if(!name){errEl.textContent='Product name is required.';errEl.style.display='block';return;}
  const splitOn=document.getElementById('itSplitToggle').checked;
  const fileInput=document.getElementById('itPhoto');
  const finish=(photoData)=>{
    const base={
      productName:name, variant:document.getElementById('itVariant').value.trim(),
      vendor:document.getElementById('itVendor').value.trim(),
      category:document.getElementById('itCategory').value,
      planMarker:document.getElementById('itMarker').value.trim(),
      planUrl:document.getElementById('itPlanUrl').value.trim(),
      photo:photoData||'', containerId:null, location:'office', createdAt:Date.now()
    };
    if(splitOn){
      const roughQty=parseInt(document.getElementById('itSplitRoughQty').value)||0;
      const trimQty=parseInt(document.getElementById('itSplitTrimQty').value)||0;
      const roomLocation=document.getElementById('itLocationSplit').value.trim();
      const splitNote=document.getElementById('itSplitNote').value.trim();
      if(!splitNote){errEl.textContent='Describe what\'s in each half before splitting \u2014 this is what keeps the two halves from being confusing later.';errEl.style.display='block';return;}
      const splitGroupId=uid('sg');
      DB.splitNotes[splitGroupId]=splitNote;
      const created=[];
      if(roughQty>0){
        const it={...base, id:uid('i'), code:nextCode('item'), jobId, phase:'rough-in', trackAs:roughQty>1?'package':'individual', qty:roughQty, roomLocation, splitGroupId};
        DB.items.push(it); addLog('item',it.id,it.code,null,'office','created (split, rough-in)',currentUserName()); created.push(it);
      }
      if(trimQty>0){
        const it={...base, id:uid('i'), code:nextCode('item'), jobId, phase:'trim-out', trackAs:trimQty>1?'package':'individual', qty:trimQty, roomLocation, splitGroupId};
        DB.items.push(it); addLog('item',it.id,it.code,null,'office','created (split, trim-out)',currentUserName()); created.push(it);
      }
      closeModal(); render();
      if(created.length) openItemModal(created[0].id);
      return;
    }
    const trackAs=document.getElementById('itTrackAs').value;
    const it={...base,
      id:uid('i'), code:presetCode||nextCode('item'), jobId,
      phase:document.getElementById('itPhase').value,
      trackAs, qty:trackAs==='package'?(parseInt(document.getElementById('itQty').value)||1):1,
      roomLocation:document.getElementById('itLocation').value.trim(),
      componentIndex:parseInt(document.getElementById('itCompIndex').value)||null,
      componentTotal:parseInt(document.getElementById('itCompTotal').value)||null
    };
    DB.items.push(it);
    if(fromGenericId){const g=DB.generics.find(x=>x.id===fromGenericId); if(g){g.status='assigned'; g.assignedItemId=it.id; g.assignedAt=Date.now();}}
    addLog('item',it.id,it.code,null,'office','created',currentUserName());
    closeModal();
    render();
    openItemModal(it.id);
  };
  if(fileInput && fileInput.files && fileInput.files[0]){
    const reader=new FileReader();
    reader.onload=e=>finish(e.target.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else finish('');
}

function handleScanAdd(raw,jobId,type){
  const code=raw.trim();
  const bareCode=code.split(':')[0];
  const fb=document.getElementById('scanFeedback');
  if(!code) return;
  const item=itemsInJob(jobId).find(i=>!i.containerId && i.code.toLowerCase()===bareCode.toLowerCase());
  if(item){
    const cb=document.querySelector('.itemChk[value="'+item.id+'"]');
    if(cb) cb.checked=true;
    fb.style.color='var(--success)';
    fb.textContent='Added '+item.code+' \u2014 '+item.productName;
    const si=document.getElementById('scanInput'); if(si) si.focus();
    return;
  }
  if(type==='pallet'){
    const tote=containersInJob(jobId,'tote').find(t=>!t.parentId && t.code.toLowerCase()===bareCode.toLowerCase());
    if(tote){
      const cb=document.querySelector('.toteChk[value="'+tote.id+'"]');
      if(cb) cb.checked=true;
      fb.style.color='var(--success)';
      fb.textContent='Added tote '+tote.code;
      const si=document.getElementById('scanInput'); if(si) si.focus();
      return;
    }
  }
  fb.style.color='var(--danger)';
  fb.textContent='No unassigned item'+(type==='pallet'?' or standalone tote':'')+' found for "'+escapeHtml(bareCode)+'". It may already be assigned elsewhere.';
  const si=document.getElementById('scanInput'); if(si) si.focus();
}

  document.body.appendChild(overlay);
  if(!window.jsQR){
    document.getElementById('cameraFeedback').textContent='QR decoder failed to load (needs internet access). Use the text field to type codes instead.';
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    SCAN_STREAM=stream;
    const video=document.getElementById('scanVideo');
    video.srcObject=stream;
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d');
    let lastCode='',lastAt=0;
    function tick(){
      if(!SCAN_STREAM) return;
      const v=document.getElementById('scanVideo');
      if(v && v.readyState===v.HAVE_ENOUGH_DATA){
        canvas.width=v.videoWidth; canvas.height=v.videoHeight;
        ctx.drawImage(v,0,0,canvas.width,canvas.height);
        const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        const result=jsQR(imgData.data,imgData.width,imgData.height);
        if(result && result.data){
          const now=Date.now();
          if(result.data!==lastCode || now-lastAt>1500){
            lastCode=result.data; lastAt=now;
            handleScanAdd(result.data,jobId,type);
            const fb=document.getElementById('cameraFeedback');
            const mainFb=document.getElementById('scanFeedback');
            if(fb) fb.textContent = mainFb ? mainFb.textContent : ('Scanned: '+result.data);
          }
        }
      }
      SCAN_RAF=requestAnimationFrame(tick);
    }
    tick();
  }).catch(err=>{
    const fb=document.getElementById('cameraFeedback');
    if(fb) fb.innerHTML='Camera access failed: '+escapeHtml(err.message)+'.<br><br>On some phones, camera access only works when this page is hosted on a real web address (http/https), not opened as a local file. If this keeps failing, use the text field to type codes instead.';
  });
}
function closeCameraScan(){
  if(SCAN_RAF){cancelAnimationFrame(SCAN_RAF); SCAN_RAF=null;}
  if(SCAN_STREAM){SCAN_STREAM.getTracks().forEach(t=>t.stop()); SCAN_STREAM=null;}
  const overlay=document.getElementById('cameraOverlay');
  if(overlay) overlay.remove();
}

    <label class="f">Login code <span style="color:var(--danger)">*</span></label><input id="tmPin" placeholder="4-digit code they use to sign in" maxlength="8">
    <div class="row" style="margin-top:20px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitAddTeamMember()">Add</button>
    </div>`);
}
function submitAddTeamMember(){
  const name=document.getElementById('tmName').value.trim();
  const pin=document.getElementById('tmPin').value.trim();
  const errEl=document.getElementById('tmErr');
  if(!name){errEl.textContent='Name is required.';errEl.style.display='block';return;}
  if(!pin){errEl.textContent='A login code is required \u2014 this is what they use to sign in as themselves.';errEl.style.display='block';return;}
  if(DB.users.some(u=>u.pin===pin)){errEl.textContent='That code is already in use by someone else \u2014 codes must be unique since they\'re the only thing identifying who\'s signed in.';errEl.style.display='block';return;}
  DB.users.push({
    id:uid('u'), name,
    email:document.getElementById('tmEmail').value.trim(),
    phone:document.getElementById('tmPhone').value.trim(),
    pin
  });
  closeModal(); go('settings');
}
function openEditTeamMemberModal(userId){
  const u=DB.users.find(x=>x.id===userId); if(!u) return;
  openModal(`<span class="modal-close" onclick="closeModal()">&times;</span>
    <h2>Edit team member</h2>
    <label class="f">Name</label><input id="tmName" value="${escapeHtml(u.name)}">
    <div id="tmErr" style="display:none;color:var(--danger);font-size:12px;margin-top:4px"></div>
    <div class="two-col">
      <div><label class="f">Email (optional)</label><input id="tmEmail" value="${escapeHtml(u.email||'')}"></div>
      <div><label class="f">Phone (optional)</label><input id="tmPhone" value="${escapeHtml(u.phone||'')}"></div>
    </div>
    <label class="f">Login code <span style="color:var(--danger)">*</span></label><input id="tmPin" value="${escapeHtml(u.pin||'')}" maxlength="8">
    <div class="row" style="margin-top:20px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitEditTeamMember('${u.id}')">Save</button>
    </div>`);
}
function submitEditTeamMember(userId){
  const u=DB.users.find(x=>x.id===userId); if(!u) return;
  const name=document.getElementById('tmName').value.trim();
  const pin=document.getElementById('tmPin').value.trim();
  const errEl=document.getElementById('tmErr');
  if(!name){errEl.textContent='Name is required.';errEl.style.display='block';return;}
  if(!pin){errEl.textContent='A login code is required.';errEl.style.display='block';return;}
  if(DB.users.some(x=>x.id!==userId && x.pin===pin)){errEl.textContent='That code is already in use by someone else \u2014 codes must be unique.';errEl.style.display='block';return;}
  u.name=name;
  u.email=document.getElementById('tmEmail').value.trim();
  u.phone=document.getElementById('tmPhone').value.trim();
  u.pin=pin;
  closeModal(); go('settings');
}
function removeTeamMember(userId){
  if(DB.users.length<=1){alert('At least one team member is required.');return;}
  DB.users=DB.users.filter(u=>u.id!==userId);
  if(DB.currentUserId===userId) DB.currentUserId=DB.users[0].id;
  go('settings');
}
function tasksPanelHTML(){
  const mine=UI.taskFilter==='mine';
  const visible=DB.tasks.filter(t=>!t.done && (!mine || t.assignedToId===DB.currentUserId));
  const isOverdue=t=>t.dueDate && new Date(t.dueDate) < new Date(new Date().toDateString());
  const overdueCount=visible.filter(isOverdue).length;
  const sorted=[...visible].sort((a,b)=>(isOverdue(b)-isOverdue(a))||(a.dueDate||'').localeCompare(b.dueDate||''));
  return `<div class="tasks-panel">
    <div class="tp-head">
      <div>
        <div class="tp-title">${mine?'My Tasks':'Team Tasks'}</div>
        <div class="tp-sub">${visible.length} open task${visible.length===1?'':'s'}${overdueCount?' &middot; <strong>'+overdueCount+' overdue</strong>':''}</div>
      </div>
      <div class="row" style="gap:8px">
        <div class="tp-filter">
          <button class="${mine?'active':''}" onclick="setTaskFilter('mine')">Mine</button>
          <button class="${!mine?'active':''}" onclick="setTaskFilter('all')">Everyone's</button>
        </div>
        <button class="btn small secondary" onclick="openAddTaskModal()">+ Add task</button>
      </div>
    </div>
    ${sorted.length?sorted.map(t=>{
      const assignee=DB.users.find(u=>u.id===t.assignedToId);
      const job=t.jobId?getJob(t.jobId):null;
      const od=isOverdue(t);
      return `<div class="task-row">
        <div class="task-dot ${od?'overdue':''}"></div>
        <div class="task-main">
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-sub">${job?escapeHtml(job.name)+' &middot; ':''}${!mine?'Assigned to '+escapeHtml(assignee?assignee.name:'Unknown'):'Added by '+escapeHtml(t.createdByName||'Unknown')}</div>
          ${t.note?`<div class="task-note"><span class="tn-lbl">Note</span>${escapeHtml(t.note)}</div>`:''}
        </div>
        <div class="task-right">
          <button class="btn small ghost" onclick="toggleTaskDone('${t.id}')">Done</button>
          ${t.dueDate?`<div class="task-date ${od?'overdue':''}">${fmtDate(new Date(t.dueDate).getTime())}${od?' \u26a0':''}</div>`:''}
        </div>
      </div>`;
    }).join(''):'<div class="sub" style="padding:10px 2px">Nothing open right now.</div>'}
  </div>`;
}
function openAddTaskModal(){
  openModal(`<span class="modal-close" onclick="closeModal()">&times;</span>
    <h2>Add task</h2>
    <label class="f">Title</label><input id="taskTitle" placeholder="e.g. Get wire mesh screen">
    <div id="taskErr" style="display:none;color:var(--danger);font-size:12px;margin-top:4px"></div>
    <div class="two-col">
      <div><label class="f">Assign to</label><select id="taskAssignee">${DB.users.map(u=>`<option value="${u.id}" ${u.id===DB.currentUserId?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select></div>
      <div><label class="f">Job (optional)</label><select id="taskJob"><option value="">&mdash;</option>${DB.jobs.map(j=>`<option value="${j.id}">${escapeHtml(j.name)}</option>`).join('')}</select></div>
    </div>
    <label class="f">Due date (optional)</label><input id="taskDue" type="date">
    <label class="f">Note (optional)</label><textarea id="taskNote" placeholder="Any detail worth flagging"></textarea>
    <div class="row" style="margin-top:20px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitAddTask()">Add task</button>
    </div>`);
}
function submitAddTask(){
  const title=document.getElementById('taskTitle').value.trim();
  const errEl=document.getElementById('taskErr');
  if(!title){errEl.textContent='Task title is required.';errEl.style.display='block';return;}
  DB.tasks.push({
    id:uid('t'), title,
    assignedToId:document.getElementById('taskAssignee').value,
    jobId:document.getElementById('taskJob').value||null,
    dueDate:document.getElementById('taskDue').value||null,
    note:document.getElementById('taskNote').value.trim(),
    createdById:DB.currentUserId, createdByName:currentUserName(),
    createdAt:Date.now(), done:false
  });
  closeModal(); render();
}
function toggleTaskDone(taskId){
  const t=DB.tasks.find(x=>x.id===taskId);
  if(t){t.done=true; render();}
}
function addCategory(){
  const input=document.getElementById('newCatInput');
  const v=input.value.trim();
  if(!v) return;
  if(!DB.settings.categories.some(c=>c.toLowerCase()===v.toLowerCase())) DB.settings.categories.push(v);
  go('settings');
}
function removeCategory(name){
  DB.settings.categories=DB.settings.categories.filter(c=>c!==name);
  go('settings');
}
function saveSettings(){
  DB.settings.companyName=document.getElementById('setName').value.trim()||'Your company';
  DB.settings.font=document.getElementById('setFont').value;
  DB.settings.address=document.getElementById('setAddress').value.trim();
  DB.settings.phone=document.getElementById('setPhone').value.trim();
  DB.settings.email=document.getElementById('setEmail').value.trim();
  DB.settings.siteContactName=document.getElementById('setSiteContactName').value.trim();
  DB.settings.siteContactPhone=document.getElementById('setSiteContactPhone').value.trim();
  DB.settings.selCoordName=document.getElementById('setSelCoordName').value.trim();
  DB.settings.selCoordPhone=document.getElementById('setSelCoordPhone').value.trim();
  const fileInput=document.getElementById('setLogo');
  const finish=()=>{document.documentElement.style.setProperty('--font-display',"'"+DB.settings.font+"',sans-serif"); render(); go('settings');};
  if(fileInput && fileInput.files && fileInput.files[0]){
    const reader=new FileReader();
    reader.onload=e=>{DB.settings.logo=e.target.result; finish();};
    reader.readAsDataURL(fileInput.files[0]);
  } else finish();
}

/* ---------------- label templates ---------------- */
function logoBoxHTML(){
  const s=DB.settings;
  return `<div class="llogobox">${s.logo?`<img src="${s.logo}">`:'Your logo'}</div>`;
}
function catIconHTML(){return `<div class="lcaticon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 7.5l9-4 9 4-9 4-9-4z"/><path d="M3 7.5v9l9 4 9-4v-9"/><path d="M12 11.5v9"/></svg></div>`;}
function itemPlanUrl(it){
  return it.planUrl ? it.planUrl : null;
}
function renderItemLabel(it){
  const c=it.containerId?getContainer(it.containerId):null;
  const qrId='qr_'+it.id+'_'+Math.random().toString(36).slice(2,7);
  const planUrl=itemPlanUrl(it);
  const qrId2='qrp_'+it.id+'_'+Math.random().toString(36).slice(2,7);
  const html=`<div class="label">
    <div class="lgrid">
      <div class="lleft">
        <div class="lk">Product name${it.componentTotal?` &middot; <span style="color:var(--ink)">${it.componentIndex||1} of ${it.componentTotal}</span>`:''}</div>
        <p class="ltitle">${escapeHtml(it.productName)}</p>
        <hr class="lhr">
        ${it.variant?`<p class="lvariant">${escapeHtml(it.variant)}</p>`:''}
        <div class="lphotorow">
          <div class="lphoto">${it.photo?`<img src="${it.photo}">`:'Product photo'}</div>
          <div class="ldbox"><div class="ldcell"><div class="lfield">Location</div><p class="lval">${it.roomLocation?escapeHtml(it.roomLocation):'&mdash;'}</p></div><div class="ldcell"><div class="lfield">Bin / pallet</div><p class="lval">${c?c.code:'Unassigned'}</p></div></div>
        </div>
      </div>
      <div class="lright">
        ${logoBoxHTML()}
        <hr class="lhr2">
        <div class="lplanwrap">
          <div class="lfield">Plan marker</div>
          <div class="lcircle"><p class="lcircval" style="font-size:${(it.planMarker||'').length>6?'13px':(it.planMarker||'').length>3?'18px':'23px'};word-break:break-word;line-height:1.05;padding:0 4px">${it.planMarker?escapeHtml(it.planMarker):'&mdash;'}</p></div>
        </div>
      </div>
    </div>
    <div class="lbottom"><div class="lcatwrap">${catIconHTML()}<div><div class="lfield">Category</div><p class="lval">${escapeHtml(it.category)}</p></div></div>
      <div class="qrblock-bottom">
        <div class="qrpair-lg">
          <div class="qrwrap-lg" id="${qrId}"></div>
          ${planUrl?`<div class="qrwrap-lg" id="${qrId2}"></div>`:`<div class="qrwrap-lg empty">No link set</div>`}
        </div>
        <div class="qrlblrow-lg"><span class="qrlbl-lg">Inventory</span><span class="qrlbl-lg">Plan location</span></div>
      </div>
    </div>
  </div>`;
  return {html,qr:planUrl?[{id:qrId,value:it.code},{id:qrId2,value:planUrl}]:[{id:qrId,value:it.code}]};
}
function renderContainerLabel(c){
  const items=itemsInJob(c.jobId).filter(i=>i.containerId===c.id);
  const nested=c.type==='pallet'?DB.containers.filter(x=>x.parentId===c.id):[];
  const qStatus='qrs_'+c.id+'_'+Math.random().toString(36).slice(2,7);
  const qSlip='qrl_'+c.id+'_'+Math.random().toString(36).slice(2,7);
  const kicker=c.type==='pallet'?'Pallet':'Tote';
  const midFields = c.type==='pallet'
    ? `<div class="ldcell"><div class="lfield">Contains tote</div><p class="lval">${nested.length?'Yes &mdash; '+nested[0].code:'No'}</p></div><div class="ldcell"><div class="lfield">Built</div><p class="lval">${fmtDate(c.createdAt)}</p></div>`
    : `<div class="ldcell"><div class="lfield">Phase</div><p class="lval">${items[0]?phaseText(items[0].phase):'Mixed'}</p></div><div class="ldcell"><div class="lfield">Built</div><p class="lval">${fmtDate(c.createdAt)}</p></div>`;
  const html=`<div class="label">
    <div class="lgrid">
      <div class="lleft">
        <div class="lk">${kicker}</div>
        <p class="ltitle">${escapeHtml(getJob(c.jobId).name)}</p>
        <hr class="lhr">
        <p class="lvariant">${c.code}</p>
        <div class="lphotorow">
          <div class="lphoto">${containerIconSvg()}</div>
          <div class="ldbox">${midFields}</div>
        </div>
      </div>
      <div class="lright">
        ${logoBoxHTML()}
        <hr class="lhr2">
        <div class="lplanwrap">
          <div class="lfield">Contents</div>
          <div class="lcircle"><p class="lcircval">${items.length}</p></div>
        </div>
      </div>
    </div>
    <div class="lbottom"><div class="lcatwrap">${catIconHTML()}<div><div class="lfield">Category</div><p class="lval">${escapeHtml(c.category||'General')}</p></div></div>
      <div class="qrblock-bottom">
        <div class="qrpair-lg">
          <div class="qrwrap-lg" id="${qStatus}"></div>
          <div class="qrwrap-lg" id="${qSlip}"></div>
        </div>
        <div class="qrlblrow-lg"><span class="qrlbl-lg">Status</span><span class="qrlbl-lg">Slip</span></div>
      </div>
    </div>
  </div>`;
  return {html,qr:[{id:qStatus,value:c.code+':status'},{id:qSlip,value:c.code+':slip'}]};
}
function containerIconSvg(){return `<svg viewBox="0 0 24 24" width="34%" height="34%" fill="none" stroke="#B7B2A6" stroke-width="1.4" stroke-linejoin="round"><path d="M3 7.5l9-4 9 4-9 4-9-4z"/><path d="M3 7.5v9l9 4 9-4v-9"/><path d="M12 11.5v9"/></svg>`;}
function phaseText(p){return p==='rough-in'?'Rough-in':'Trim-out';}
function mountQRs(list){
  list.forEach(q=>{
    const el=document.getElementById(q.id);
    if(el && window.QRCode){
      el.innerHTML='';
      const size=Math.max(40,Math.round(Math.min(el.clientWidth||110,el.clientHeight||110)))||110;
      const qr=new QRCode(el,{text:q.value,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
      const img=el.querySelector('img'); if(img){img.style.width='100%';img.style.height='100%';}
      const canvas=el.querySelector('canvas'); if(canvas){canvas.style.width='100%';canvas.style.height='100%';}
    }
  });
}

/* ---------------- modal helpers ---------------- */
function openModal(inner,size){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${size==='wide'?'wide':''}">${inner}</div></div>`;
}
function closeModal(){closeCameraScan();document.getElementById('modalRoot').innerHTML='';}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------------- init ---------------- */
(async function init(){
  DB=await loadFromSupabase();
  document.documentElement.style.setProperty('--font-display',"'"+DB.settings.font+"',sans-serif");
  const boot=document.getElementById('bootScreen'); if(boot) boot.remove();
  render();
  subscribeRealtime();
})();
</script>
